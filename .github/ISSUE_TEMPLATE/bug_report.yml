name: Bug report
description: Report a reproducible NearbyJobsMap problem without private data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include cookies, credentials, raw source HTML, personal notes, private application data, SQLite databases, or browser profiles.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js and npm versions
      placeholder: Node 22.x, npm 10.x
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: .\scripts\start.ps1
    validations:
      required: true
  - type: dropdown
    id: install_mode
    attributes:
      label: Installation mode
      options: ["Standard", "-SkipBrowserInstall", "-RequireBrowserInstall", "Manual npm commands", "Unknown"]
    validations:
      required: true
  - type: dropdown
    id: chromium
    attributes:
      label: Is Playwright Chromium installed?
      options: ["Yes", "No", "Unknown"]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor summary
      description: Paste PASS/WARN/FAIL labels only. A support bundle is optional; inspect it before attaching.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove paths, credentials, cookies, private notes, job descriptions, and personal data.
      render: text
  - type: dropdown
    id: collection
    attributes:
      label: Was source collection explicitly enabled?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
  - type: dropdown
    id: support_bundle
    attributes:
      label: Did you inspect and attach a support bundle?
      options: ["No", "Yes", "Not applicable"]
    validations:
      required: true
