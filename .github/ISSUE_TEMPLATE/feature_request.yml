name: Feature request
description: Propose a local-first product improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What local workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
    validations:
      required: true
  - type: textarea
    id: local
    attributes:
      label: Local-only and privacy implications
      description: Describe database, filesystem, personal-data, or localhost considerations.
  - type: dropdown
    id: source
    attributes:
      label: Does this require new or changed third-party source access?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
  - type: markdown
    attributes:
      value: New source access requires separate permission and safety review. Do not attach credentials, cookies, private databases, or raw source pages.
