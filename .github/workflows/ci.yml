name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEARBY_JOBS_ENABLE_COLLECTION_UI: "0"
      NEARBY_JOBS_DB_PATH: ${{ runner.temp }}/nearby-jobs-ci.sqlite
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test offline contracts
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bounded release audit
        run: npm run release:audit
